services:
  - type: web
    name: lyra-site-api-mellissa-spinelli
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/main.py
    healthCheckPath: /api/status
    envVars:
      - key: LYRA_SESSION_SECRET
        generateValue: true
      - key: LYRA_ACCESS_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LYRA_ALLOWED_ORIGINS
        value: https://mellissa-spinelli.github.io
      - key: LYRA_MEMORY_PATH
        value: /tmp/lyra-memoria.json
