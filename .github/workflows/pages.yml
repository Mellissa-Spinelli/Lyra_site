name: Publicar prévia da LYRA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v5
      - name: Montar os arquivos públicos do site
        run: |
          mkdir dist
          cp index.html styles.css app.js dist/
      - name: Enviar o site para publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
